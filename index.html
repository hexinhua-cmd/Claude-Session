<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT PMO – Project Board</title>
<style>
  /* ===== Design tokens: retro-futuristic mission-control, dark green phosphor ===== */
  :root {
    --bg: #05160d;
    --bg-grid: rgba(125,255,178,0.045);
    --panel: #0a2617;
    --panel-2: #0f331f;
    --panel-3: #144329;
    --line: #1f6040;
    --line-soft: #174a31;
    --phosphor: #7dffb2;
    --phosphor-dim: #3fbf7a;
    --ink: #d6f7e2;
    --ink-soft: #8dbfa2;
    --red: #ff6f5a;
    --red-bg: rgba(255,111,90,0.14);
    --amber: #ffb83d;
    --amber-bg: rgba(255,184,61,0.14);
    --cyan: #5fe3d0;
    --cyan-bg: rgba(95,227,208,0.13);
    --grey: #6f9a83;
    --grey-bg: rgba(141,191,162,0.12);
    --glow: 0 0 10px rgba(125,255,178,0.35);
    --sp-1: 4px;
    --sp-2: 8px;
    --sp-3: 12px;
    --sp-4: 16px;
    --sp-5: 24px;
    --radius: 3px;
    --font: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", "Courier New", monospace;
  }

  /* ===== Base ===== */
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    margin: 0;
    font-family: var(--font);
    font-size: 14px;
    color: var(--ink);
    background-color: var(--bg);
    background-image:
      linear-gradient(var(--bg-grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
    background-size: 32px 32px;
    line-height: 1.5;
    min-height: 100vh;
  }
  /* CRT scanlines: purely decorative, never intercepts input */
  body::after {
    content: "";
    position: fixed; inset: 0; pointer-events: none; z-index: 100;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0.16) 0, rgba(0,0,0,0.16) 1px, transparent 1px, transparent 3px);
  }
  :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }

  /* ===== Header: the one loud element ===== */
  .app-header {
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border-bottom: 2px solid var(--phosphor-dim);
    box-shadow: 0 4px 24px rgba(125,255,178,0.12);
    padding: var(--sp-4) var(--sp-5);
    display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-4);
  }
  .wordmark {
    font-size: 22px; font-weight: 700; letter-spacing: 0.18em;
    color: var(--phosphor); text-shadow: 0 0 14px rgba(125,255,178,0.7);
  }
  .wordmark span {
    font-weight: 400; letter-spacing: 0.08em; color: var(--ink);
    margin-left: var(--sp-3); text-shadow: none;
  }
  .wordmark span::after {
    content: "_"; color: var(--phosphor); margin-left: 2px;
    animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .summary { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin: 0; padding: 0; list-style: none; flex: 1; }
  .summary li {
    border: 1px solid var(--line); background: rgba(5,22,13,0.6); border-radius: var(--radius);
    padding: var(--sp-1) var(--sp-3); font-size: 13px; color: var(--ink-soft);
  }
  .summary strong { font-size: 16px; margin-left: var(--sp-1); color: var(--phosphor); }
  .summary .overdue-stat { border-color: var(--red); background: var(--red-bg); color: var(--ink); }
  .summary .overdue-stat strong { color: var(--red); }
  .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: var(--sp-1); }
  .reset-note { font-size: 11px; color: var(--ink-soft); margin: 0; }

  .btn {
    border: 1px solid var(--phosphor); background: var(--phosphor); color: #04190d;
    border-radius: var(--radius); padding: var(--sp-2) var(--sp-4); font-weight: 700; letter-spacing: 0.04em;
    box-shadow: var(--glow);
  }
  .btn:hover { background: #a6ffcb; }
  .btn:disabled { opacity: 0.55; cursor: not-allowed; }
  .btn-secondary { background: transparent; color: var(--phosphor); box-shadow: none; }
  .btn-secondary:hover { background: var(--panel-3); }

  /* ===== Filter bar ===== */
  .filters {
    display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--sp-3);
    padding: var(--sp-3) var(--sp-5); background: rgba(10,38,23,0.85); border-bottom: 1px solid var(--line-soft);
  }
  .filters label { display: flex; flex-direction: column; font-size: 12px; font-weight: 600; color: var(--ink-soft); gap: var(--sp-1); }
  .filters select, .filters input {
    min-width: 180px; padding: 6px var(--sp-2); border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--bg); color: var(--ink);
  }
  .filters input::placeholder { color: var(--grey); }

  /* ===== Board ===== */
  .board {
    display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: var(--sp-4); padding: var(--sp-5); align-items: start;
  }
  .column { background: rgba(10,38,23,0.8); border-radius: var(--radius); border: 1px solid var(--line-soft); }
  .column.drop-target { border-color: var(--phosphor); background: var(--panel-3); box-shadow: var(--glow); }
  .column-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: var(--sp-3) var(--sp-3) var(--sp-1); border-bottom: 1px dashed var(--line);
    margin-bottom: var(--sp-2);
  }
  .column-header h2 { margin: 0; font-size: 14px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--phosphor); }
  .count {
    border: 1px solid var(--phosphor-dim); color: var(--phosphor); border-radius: var(--radius);
    min-width: 26px; text-align: center; padding: 1px var(--sp-2); font-size: 12px; font-weight: 700;
  }
  .column-hint { margin: 0; padding: 0 var(--sp-3) var(--sp-2); font-size: 11px; color: var(--ink-soft); }
  .card-list { padding: 0 var(--sp-2) var(--sp-2); min-height: 80px; display: flex; flex-direction: column; gap: var(--sp-2); }
  .empty { color: var(--ink-soft); font-size: 12px; text-align: center; padding: var(--sp-4) 0; }

  /* ===== Card ===== */
  .card {
    background: var(--panel-2); border-radius: var(--radius); border: 1px solid var(--line-soft); border-left: 4px solid var(--grey);
    padding: var(--sp-3); cursor: grab;
  }
  .card:hover { border-color: var(--line); border-left-color: inherit; }
  .card.dragging { opacity: 0.4; }
  .card.p-critical { border-left-color: var(--red); }
  .card.p-high { border-left-color: var(--amber); }
  .card.p-medium { border-left-color: var(--cyan); }
  .card.p-low { border-left-color: var(--grey); }
  .card-top { display: flex; justify-content: space-between; align-items: center; gap: var(--sp-2); }
  .task-id { font-size: 11px; font-weight: 700; color: var(--phosphor-dim); letter-spacing: 0.06em; }
  .card h3 { margin: var(--sp-1) 0; font-size: 14px; line-height: 1.35; color: var(--ink); }
  .meta { margin: 0; font-size: 12px; color: var(--ink-soft); }
  .meta strong { color: var(--ink); font-weight: 600; }
  .tags { display: flex; flex-wrap: wrap; gap: var(--sp-1); margin: var(--sp-2) 0; align-items: center; }
  .pill, .tag, .badge-overdue { font-size: 11px; font-weight: 700; padding: 2px var(--sp-2); border-radius: var(--radius); }
  .pill-critical { background: var(--red-bg); color: var(--red); border: 1px solid var(--red); }
  .pill-high { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber); }
  .pill-medium { background: var(--cyan-bg); color: var(--cyan); border: 1px solid var(--cyan); }
  .pill-low { background: var(--grey-bg); color: var(--ink-soft); border: 1px solid var(--grey); }
  .tag { background: transparent; border: 1px solid var(--line); color: var(--ink-soft); font-weight: 600; }
  .badge-overdue { background: var(--red); color: #1c0602; border: 1px solid var(--red); }
  .card-actions { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); margin-top: var(--sp-2); }
  .move-label { display: flex; align-items: center; gap: var(--sp-1); font-size: 12px; font-weight: 600; color: var(--phosphor-dim); }
  .move-label select { padding: 2px var(--sp-1); border: 1px solid var(--line); border-radius: var(--radius); font-size: 12px; background: var(--bg); color: var(--ink); }
  .icon-btn {
    border: 1px solid transparent; background: transparent; font-size: 18px; line-height: 1;
    width: 28px; height: 28px; border-radius: var(--radius); color: var(--ink-soft);
  }
  .icon-btn:hover { background: var(--red-bg); color: var(--red); border-color: var(--red); }
  .confirm { display: flex; align-items: center; gap: var(--sp-1); font-size: 12px; font-weight: 600; color: var(--red); }
  .confirm button { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: var(--radius); padding: 2px var(--sp-2); font-size: 12px; }
  .confirm .yes { background: var(--red); color: #1c0602; border-color: var(--red); }

  /* ===== Modal ===== */
  dialog {
    border: 1px solid var(--phosphor-dim); border-radius: var(--radius); padding: 0; width: min(560px, 94vw);
    background: var(--panel); color: var(--ink); box-shadow: 0 0 40px rgba(125,255,178,0.22);
  }
  dialog::backdrop { background: rgba(2,10,6,0.78); }
  .modal-head { background: var(--panel-3); border-bottom: 1px solid var(--phosphor-dim); color: var(--phosphor); padding: var(--sp-3) var(--sp-4); display: flex; justify-content: space-between; align-items: center; }
  .modal-head h2 { margin: 0; font-size: 16px; letter-spacing: 0.08em; }
  .modal-head .icon-btn { color: var(--phosphor); }
  .modal-head .icon-btn:hover { background: var(--panel); color: var(--phosphor); border-color: var(--phosphor-dim); }
  form { padding: var(--sp-4); display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); }
  .field { display: flex; flex-direction: column; gap: var(--sp-1); }
  .field.full { grid-column: 1 / -1; }
  .field label { font-weight: 600; font-size: 13px; color: var(--ink-soft); }
  .field input, .field select, .field textarea {
    padding: 7px var(--sp-2); border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); color: var(--ink); width: 100%;
  }
  .field textarea { min-height: 80px; resize: vertical; }
  .field.invalid input, .field.invalid select, .field.invalid textarea { border-color: var(--red); }
  .error { color: var(--red); font-size: 12px; margin: 0; min-height: 0; }
  .error:empty { display: none; }
  .form-actions { grid-column: 1 / -1; display: flex; justify-content: flex-end; gap: var(--sp-2); }

  /* ===== Toasts ===== */
  .toasts { position: fixed; bottom: var(--sp-4); right: var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-2); z-index: 150; max-width: 340px; }
  .toast { padding: var(--sp-3) var(--sp-4); border-radius: var(--radius); font-weight: 600; background: var(--panel-3); border: 1px solid var(--phosphor); color: var(--ink); box-shadow: var(--glow); }
  .toast-success { border-color: var(--phosphor); }
  .toast-warning { border-color: var(--amber); color: var(--amber); box-shadow: none; }

  /* ===== Overdue column (derived, red theme) ===== */
  .column-overdue { background: rgba(58,14,10,0.78); border-color: var(--red); box-shadow: 0 0 18px rgba(255,111,90,0.18); }
  .column-overdue .column-header { border-bottom-color: var(--red); }
  .column-overdue .column-header h2 { color: var(--red); text-shadow: 0 0 10px rgba(255,111,90,0.5); }
  .column-overdue .count { border-color: var(--red); background: var(--red); color: #1c0602; }
  .column-overdue .column-hint, .column-overdue .empty { color: #e3a79d; }
  .column-overdue .card { background: #4a1812; border-color: #7a2e24; border-left-color: var(--red); }
  .column-overdue .task-id, .column-overdue .move-label { color: #ff9a8a; }
  .column-overdue .meta { color: #e3a79d; }
  .column-overdue .meta strong { color: var(--ink); }
  .column-overdue .tag { border-color: #7a2e24; color: #e3a79d; }

  /* ===== Responsive ===== */
  @media (max-width: 1100px) {
    .board { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .column-overdue { grid-column: 1 / -1; }
  }
  @media (max-width: 767px) {
    .board { grid-template-columns: 1fr; padding: var(--sp-3); }
    .app-header, .filters { padding-left: var(--sp-3); padding-right: var(--sp-3); }
    .header-right { align-items: flex-start; }
    form { grid-template-columns: 1fr; }
    .filters select, .filters input { min-width: 0; width: 100%; }
    .filters label { flex: 1 1 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .wordmark span::after { animation: none; }
  }
</style>
</head>
<body>

<header class="app-header">
  <div class="wordmark">IT PMO<span>Project Board</span></div>
  <ul class="summary" id="summary" aria-label="Board summary"></ul>
  <div class="header-right">
    <button type="button" class="btn" id="open-add">+ Add Task</button>
    <p class="reset-note">Demo data lives in memory only – refreshing the page resets the board.</p>
  </div>
</header>

<section class="filters" aria-label="Filters">
  <label>Project
    <select id="f-project"><option value="">All projects</option></select>
  </label>
  <label>Assignee contains
    <input type="text" id="f-assignee" placeholder="e.g. Tan">
  </label>
  <label>Priority
    <select id="f-priority"><option value="">All priorities</option></select>
  </label>
  <button type="button" class="btn btn-secondary" id="f-clear">Clear filters</button>
</section>

<main class="board" id="board" aria-label="Kanban board"></main>

<dialog id="add-dialog" aria-labelledby="add-title">
  <div class="modal-head">
    <h2 id="add-title">Add Task</h2>
    <button type="button" class="icon-btn" id="close-add" aria-label="Close add task dialog">&times;</button>
  </div>
  <form id="task-form" novalidate>
    <div class="field full">
      <label for="t-title">Task Title *</label>
      <input type="text" id="t-title" maxlength="80" autocomplete="off">
      <p class="error" id="e-title"></p>
    </div>
    <div class="field full">
      <label for="t-desc">Description</label>
      <textarea id="t-desc" maxlength="500"></textarea>
      <p class="error" id="e-desc"></p>
    </div>
    <div class="field">
      <label for="t-project">Project / Workstream *</label>
      <select id="t-project"></select>
      <p class="error" id="e-project"></p>
    </div>
    <div class="field">
      <label for="t-category">Category *</label>
      <select id="t-category"></select>
      <p class="error" id="e-category"></p>
    </div>
    <div class="field">
      <label for="t-assignee">Assignee *</label>
      <input type="text" id="t-assignee" autocomplete="off">
      <p class="error" id="e-assignee"></p>
    </div>
    <div class="field">
      <label for="t-priority">Priority *</label>
      <select id="t-priority"></select>
      <p class="error" id="e-priority"></p>
    </div>
    <div class="field">
      <label for="t-due">Due Date *</label>
      <input type="date" id="t-due">
      <p class="error" id="e-due"></p>
    </div>
    <div class="field">
      <label for="t-status">Status *</label>
      <select id="t-status"></select>
      <p class="error" id="e-status"></p>
    </div>
    <div class="form-actions">
      <button type="button" class="btn btn-secondary" id="cancel-add">Cancel</button>
      <button type="submit" class="btn" id="submit-btn">Add Task</button>
    </div>
  </form>
</dialog>

<div class="toasts" id="toasts" aria-live="polite"></div>

<!--
  FORMSUBMIT SETUP (one-time activation):
  FormSubmit needs the target email address to be activated. The FIRST submission
  sends a confirmation email to the address in FORMSUBMIT_ENDPOINT. Notifications
  are only delivered AFTER the link in that email has been clicked. Until then
  the board still works; only the email notification will not arrive.
-->
<script>
"use strict";

/* ===================== CONFIG ===================== */
// >>> Change the email address here (only place it appears) <<<
const FORMSUBMIT_ENDPOINT = "https://formsubmit.co/ajax/YOUR_EMAIL@example.com";

const STATUSES = ["Backlog", "In Progress", "Blocked", "Done"];
const STATUS_HINTS = {
  "Backlog": "Logged, not yet scheduled",
  "In Progress": "Actively being worked",
  "Blocked": "Waiting on dependency, vendor or approval",
  "Done": "Completed / closed"
};
const OVERDUE_COLUMN = "Overdue"; // derived column, not a status
const COLUMNS = [OVERDUE_COLUMN].concat(STATUSES);
const COLUMN_HINTS = Object.assign({ "Overdue": "Past due date and not done" }, STATUS_HINTS);
const PROJECTS = ["Core Banking Upgrade", "Digital Channels", "Cybersecurity Uplift", "Data & Analytics", "Infrastructure & Cloud", "Vendor Management"];
const CATEGORIES = ["Application Development", "Infrastructure", "Cybersecurity", "Data", "Compliance", "Vendor"];
const PRIORITIES = ["Critical", "High", "Medium", "Low"];

/* ===================== STATE (in memory only) ===================== */
const state = {
  tasks: [],
  filters: { project: "", assignee: "", priority: "" },
  confirmDeleteId: null
};
let idCounter = 0;
let dragId = null;

/* ===================== HELPERS ===================== */
function escapeHtml(value) {
  return String(value)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function nextTaskId() {
  idCounter += 1;
  return "UOB-ITPM-" + String(idCounter).padStart(4, "0");
}
function todayISO() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function offsetDate(days) {
  const d = new Date();
  d.setDate(d.getDate() + days);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function isOverdue(task) {
  return task.status !== "Done" && task.dueDate < todayISO(); // ISO strings compare lexically
}
function columnOf(task) {
  return isOverdue(task) ? OVERDUE_COLUMN : task.status;
}
function daysOverdue(task) {
  const ms = new Date(todayISO()) - new Date(task.dueDate);
  return Math.max(1, Math.round(ms / 86400000));
}
function $(id) { return document.getElementById(id); }

/* ===================== SEED DATA ===================== */
function seedTasks() {
  const seed = [
    ["Migrate FX pricing service to AWS", "Lift and shift the FX pricing engine to the cloud landing zone.", "Infrastructure & Cloud", "Infrastructure", "Priya Nair", "High", 21, "In Progress"],
    ["Patch CVE-2025-XXXX on branch teller VDI", "Roll out vendor security patch to branch teller virtual desktops.", "Cybersecurity Uplift", "Cybersecurity", "Marcus Tan", "Critical", -3, "In Progress"],
    ["UAT sign-off for mobile onboarding release 4.2", "Collect business sign-off for the mobile onboarding release.", "Digital Channels", "Application Development", "Aisha Rahman", "High", 5, "Blocked"],
    ["Core ledger upgrade – SIT environment build", "Provision SIT environment for the core ledger version upgrade.", "Core Banking Upgrade", "Infrastructure", "Daniel Lim", "Medium", 30, "Backlog"],
    ["Data lineage mapping for regulatory reports", "Document lineage for the top 20 regulatory reports.", "Data & Analytics", "Data", "Chen Wei", "Medium", 45, "Backlog"],
    ["Renew SWIFT connectivity vendor contract", "Negotiate and renew managed connectivity contract.", "Vendor Management", "Vendor", "Sofia Alvarez", "Low", -7, "Blocked"],
    ["Quarterly access recertification – privileged accounts", "Complete privileged access review for Q4.", "Cybersecurity Uplift", "Compliance", "Ravi Kumar", "High", 10, "Backlog"],
    ["Retire legacy reporting data mart", "Decommission the legacy data mart after migration sign-off.", "Data & Analytics", "Data", "Chen Wei", "Low", -10, "Done"]
  ];
  state.tasks = seed.map(function (s) {
    return {
      id: nextTaskId(), title: s[0], description: s[1], project: s[2], category: s[3],
      assignee: s[4], priority: s[5], dueDate: offsetDate(s[6]), status: s[7]
    };
  });
}

/* ===================== FILTERING ===================== */
function applyFilters(tasks) {
  const f = state.filters;
  const needle = f.assignee.trim().toLowerCase();
  return tasks.filter(function (t) {
    if (f.project && t.project !== f.project) return false;
    if (f.priority && t.priority !== f.priority) return false;
    if (needle && t.assignee.toLowerCase().indexOf(needle) === -1) return false;
    return true;
  });
}

/* ===================== RENDERING ===================== */
function renderCard(task) {
  const overdue = isOverdue(task);
  const confirming = state.confirmDeleteId === task.id;
  const moveOptions = STATUSES.map(function (s) {
    return '<option value="' + escapeHtml(s) + '"' + (s === task.status ? " selected" : "") + ">" + escapeHtml(s) + "</option>";
  }).join("");
  const actions = confirming
    ? '<span class="confirm">Delete? <button type="button" class="yes" data-action="delete-yes" data-id="' + escapeHtml(task.id) + '">Yes</button>' +
      '<button type="button" data-action="delete-no" data-id="' + escapeHtml(task.id) + '">No</button></span>'
    : '<button type="button" class="icon-btn" data-action="delete" data-id="' + escapeHtml(task.id) + '" aria-label="Delete task ' + escapeHtml(task.id) + '">&times;</button>';

  return '<article class="card p-' + task.priority.toLowerCase() + '" draggable="true" data-id="' + escapeHtml(task.id) + '">' +
    '<div class="card-top"><span class="task-id">' + escapeHtml(task.id) + "</span>" +
    (overdue ? '<span class="badge-overdue">' + daysOverdue(task) + "d overdue</span>" : "") + "</div>" +
    "<h3>" + escapeHtml(task.title) + "</h3>" +
    '<p class="meta">' + escapeHtml(task.project) + "</p>" +
    '<p class="meta">Assignee: <strong>' + escapeHtml(task.assignee) + "</strong></p>" +
    '<p class="meta">Due: <strong>' + escapeHtml(task.dueDate) + "</strong></p>" +
    (overdue ? '<p class="meta">Status: <strong>' + escapeHtml(task.status) + "</strong></p>" : "") +
    '<div class="tags"><span class="pill pill-' + task.priority.toLowerCase() + '">' + escapeHtml(task.priority) + "</span>" +
    '<span class="tag">' + escapeHtml(task.category) + "</span></div>" +
    '<div class="card-actions">' +
    '<label class="move-label">Move &#9656; <select data-action="move" data-id="' + escapeHtml(task.id) + '" aria-label="Move ' + escapeHtml(task.id) + ' to column">' + moveOptions + "</select></label>" +
    actions + "</div></article>";
}

function renderSummary() {
  const all = state.tasks;
  let html = '<li>Total<strong>' + all.length + "</strong></li>";
  COLUMNS.forEach(function (c) {
    html += "<li" + (c === OVERDUE_COLUMN ? ' class="overdue-stat"' : "") + ">" + escapeHtml(c) +
      "<strong>" + all.filter(function (t) { return columnOf(t) === c; }).length + "</strong></li>";
  });
  $("summary").innerHTML = html;
}

// Single place where the board DOM is rebuilt from state.
function renderBoard() {
  const visible = applyFilters(state.tasks);
  $("board").innerHTML = COLUMNS.map(function (status) {
    const cards = visible.filter(function (t) { return columnOf(t) === status; });
    const isOverdueCol = status === OVERDUE_COLUMN;
    return '<section class="column' + (isOverdueCol ? " column-overdue" : "") + '" data-status="' + escapeHtml(status) + '" aria-label="' + escapeHtml(status) + ' column">' +
      '<div class="column-header"><h2>' + escapeHtml(status) + '</h2><span class="count" aria-label="' + cards.length + ' tasks">' + cards.length + "</span></div>" +
      '<p class="column-hint">' + escapeHtml(COLUMN_HINTS[status]) + "</p>" +
      '<div class="card-list">' + (cards.length ? cards.map(renderCard).join("") : '<div class="empty">' + (isOverdueCol ? "Nothing overdue" : "No tasks") + "</div>") + "</div></section>";
  }).join("");
  renderSummary();
}

/* ===================== ACTIONS ===================== */
function addTask(data) {
  const task = {
    id: nextTaskId(), title: data.title, description: data.description, project: data.project,
    category: data.category, assignee: data.assignee, priority: data.priority,
    dueDate: data.dueDate, status: data.status
  };
  state.tasks.push(task);
  renderBoard();
  return task;
}

function moveTask(id, status) {
  const task = state.tasks.find(function (t) { return t.id === id; });
  if (!task || STATUSES.indexOf(status) === -1 || task.status === status) return;
  task.status = status;
  renderBoard();
  if (isOverdue(task)) showToast(task.id + " is still overdue. Mark it Done to clear it.", "warning");
}

function deleteTask(id) {
  state.tasks = state.tasks.filter(function (t) { return t.id !== id; });
  state.confirmDeleteId = null;
  renderBoard();
}

/* ===================== TOASTS ===================== */
function showToast(message, type) {
  const el = document.createElement("div");
  el.className = "toast toast-" + (type || "success");
  el.textContent = message; // textContent: safe
  $("toasts").appendChild(el);
  setTimeout(function () { el.remove(); }, 5000);
}

/* ===================== FORMSUBMIT ===================== */
async function notifyNewTask(task) {
  const res = await fetch(FORMSUBMIT_ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "application/json", Accept: "application/json" },
    body: JSON.stringify({
      _subject: "[UOB IT PMO] New task " + task.id + ": " + task.title,
      _template: "table",
      _captcha: "false",
      "Task ID": task.id,
      Title: task.title,
      Description: task.description,
      Project: task.project,
      Category: task.category,
      Assignee: task.assignee,
      Priority: task.priority,
      "Due Date": task.dueDate,
      Status: task.status,
      "Submitted At": new Date().toISOString()
    })
  });
  if (!res.ok) throw new Error("FormSubmit failed: " + res.status);
  return res.json();
}

/* ===================== FORM ===================== */
function readForm() {
  return {
    title: $("t-title").value.trim(),
    description: $("t-desc").value.trim(),
    project: $("t-project").value,
    category: $("t-category").value,
    assignee: $("t-assignee").value.trim(),
    priority: $("t-priority").value,
    dueDate: $("t-due").value,
    status: $("t-status").value
  };
}

function setError(field, message) {
  $("e-" + field).textContent = message;
  const input = { title: "t-title", desc: "t-desc", project: "t-project", category: "t-category", assignee: "t-assignee", priority: "t-priority", due: "t-due", status: "t-status" }[field];
  $(input).closest(".field").classList.toggle("invalid", !!message);
  $(input).setAttribute("aria-invalid", message ? "true" : "false");
}

function validateForm(d) {
  const errors = {};
  if (!d.title) errors.title = "Task title is required.";
  else if (d.title.length > 80) errors.title = "Title must be 80 characters or fewer.";
  if (d.description.length > 500) errors.desc = "Description must be 500 characters or fewer.";
  if (PROJECTS.indexOf(d.project) === -1) errors.project = "Choose a project.";
  if (CATEGORIES.indexOf(d.category) === -1) errors.category = "Choose a category.";
  if (!d.assignee) errors.assignee = "Assignee is required.";
  if (PRIORITIES.indexOf(d.priority) === -1) errors.priority = "Choose a priority.";
  if (!d.dueDate) errors.due = "Due date is required.";
  else if (d.dueDate < todayISO()) errors.due = "Due date must not be in the past.";
  if (STATUSES.indexOf(d.status) === -1) errors.status = "Choose a status.";
  ["title", "desc", "project", "category", "assignee", "priority", "due", "status"].forEach(function (f) {
    setError(f, errors[f] || "");
  });
  return Object.keys(errors).length === 0;
}

async function handleSubmit(event) {
  event.preventDefault();
  const data = readForm();
  if (!validateForm(data)) {
    const firstBad = $("task-form").querySelector('[aria-invalid="true"]');
    if (firstBad) firstBad.focus();
    return;
  }
  const btn = $("submit-btn");
  btn.disabled = true;
  btn.textContent = "Sending…";

  // Optimistic UI: card shows immediately, email goes out in parallel.
  const task = addTask(data);
  resetForm();
  closeDialog();
  showToast("Task " + task.id + " added.", "success");

  try {
    await notifyNewTask(task);
  } catch (err) {
    showToast("Card added locally — email notification failed", "warning");
  } finally {
    btn.disabled = false;
    btn.textContent = "Add Task";
  }
}

function resetForm() {
  $("task-form").reset();
  $("t-priority").value = "Medium";
  $("t-status").value = "Backlog";
  ["title", "desc", "project", "category", "assignee", "priority", "due", "status"].forEach(function (f) { setError(f, ""); });
}

/* ===================== MODAL ===================== */
let lastFocus = null;
function openDialog() {
  lastFocus = document.activeElement;
  $("t-due").min = todayISO();
  $("add-dialog").showModal();
  $("t-title").focus();
}
function closeDialog() {
  const dlg = $("add-dialog");
  if (dlg.open) dlg.close();
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}

/* ===================== DRAG & DROP ===================== */
function clearDropHighlights() {
  document.querySelectorAll(".column.drop-target").forEach(function (c) { c.classList.remove("drop-target"); });
}
function wireDragAndDrop() {
  const board = $("board");
  board.addEventListener("dragstart", function (e) {
    const card = e.target.closest && e.target.closest(".card");
    if (!card) return;
    dragId = card.dataset.id;
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", dragId);
    card.classList.add("dragging");
  });
  board.addEventListener("dragend", function () {
    dragId = null;
    clearDropHighlights();
    document.querySelectorAll(".card.dragging").forEach(function (c) { c.classList.remove("dragging"); });
  });
  board.addEventListener("dragover", function (e) {
    const col = e.target.closest(".column");
    if (!col || !dragId || col.dataset.status === OVERDUE_COLUMN) return; // Overdue is computed, not droppable
    e.preventDefault(); // allow drop
    e.dataTransfer.dropEffect = "move";
    if (!col.classList.contains("drop-target")) {
      clearDropHighlights();
      col.classList.add("drop-target");
    }
  });
  board.addEventListener("drop", function (e) {
    const col = e.target.closest(".column");
    if (!col || !dragId || col.dataset.status === OVERDUE_COLUMN) return;
    e.preventDefault();
    const id = dragId;
    dragId = null;
    clearDropHighlights();
    moveTask(id, col.dataset.status);
  });
}

/* ===================== INIT / WIRING ===================== */
function fillSelect(el, items) {
  items.forEach(function (item) {
    const o = document.createElement("option");
    o.value = item;
    o.textContent = item;
    el.appendChild(o);
  });
}

function init() {
  fillSelect($("f-project"), PROJECTS);
  fillSelect($("f-priority"), PRIORITIES);
  fillSelect($("t-project"), PROJECTS);
  fillSelect($("t-category"), CATEGORIES);
  fillSelect($("t-priority"), PRIORITIES);
  fillSelect($("t-status"), STATUSES);
  $("t-priority").value = "Medium";
  $("t-status").value = "Backlog";

  seedTasks();
  renderBoard();
  wireDragAndDrop();

  $("open-add").addEventListener("click", openDialog);
  $("close-add").addEventListener("click", closeDialog);
  $("cancel-add").addEventListener("click", closeDialog);
  $("task-form").addEventListener("submit", handleSubmit);

  // Filters
  $("f-project").addEventListener("change", function (e) { state.filters.project = e.target.value; renderBoard(); });
  $("f-priority").addEventListener("change", function (e) { state.filters.priority = e.target.value; renderBoard(); });
  $("f-assignee").addEventListener("input", function (e) { state.filters.assignee = e.target.value; renderBoard(); });
  $("f-clear").addEventListener("click", function () {
    state.filters = { project: "", assignee: "", priority: "" };
    $("f-project").value = ""; $("f-priority").value = ""; $("f-assignee").value = "";
    renderBoard();
  });

  // Card actions (delegated): delete confirm toggle and keyboard Move control
  $("board").addEventListener("click", function (e) {
    const btn = e.target.closest("button[data-action]");
    if (!btn) return;
    const id = btn.dataset.id;
    if (btn.dataset.action === "delete") { state.confirmDeleteId = id; renderBoard(); }
    else if (btn.dataset.action === "delete-no") { state.confirmDeleteId = null; renderBoard(); }
    else if (btn.dataset.action === "delete-yes") { deleteTask(id); }
  });
  $("board").addEventListener("change", function (e) {
    const sel = e.target.closest("select[data-action='move']");
    if (sel) moveTask(sel.dataset.id, sel.value);
  });
}

init();
</script>
